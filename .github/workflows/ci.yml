# Intégration continue : lint, types, tests unitaires, build strict et tests de bout en bout
# (Chromium, WebKit) sur chaque demande de fusion, et sur main après fusion.
# Repris de Le poids des choses : Ubuntu épinglé (une nouvelle version peut casser les
# dépendances système de WebKit), navigateurs Playwright en cache.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualite:
    name: Lint, types, tests, build, bout en bout
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Version de pnpm lue dans le champ packageManager de package.json.
      - uses: pnpm/action-setup@v6

      # Version de Node lue dans .nvmrc (24), comme Cloudflare Pages.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Types
        run: pnpm typecheck

      - name: Tests unitaires
        run: pnpm test

      - name: Build (export statique)
        run: pnpm build

      - name: Version de Playwright
        id: playwright
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=$ImageOS" >> "$GITHUB_OUTPUT"

      - name: Cache des navigateurs Playwright
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}

      - name: Navigateurs Playwright (installation complète)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Navigateurs Playwright (dépendances système seulement)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium webkit

      - name: Tests de bout en bout (Chromium, WebKit)
        run: pnpm e2e

      - name: Rapport Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
